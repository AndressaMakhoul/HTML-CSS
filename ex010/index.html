<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalhando com Links.</title>
</head>
<body>
    <h1>Usando links externos</h1> <!--envelopar a frase (command + shift + p - dar enter e colocar a tag a) / atributo target blank faz com que o site seja aberto em outra aba quando o vídeo está em outro site, evitando que a pessoa saia do seu site, usar rel external também é importante.-->
    <p>Você pode acessar o meu <a href="https://gustavoguanabara.github.io" target="_blank" rel="external">repositório público no GitHub</a>.</p>
    <p>Você também pode acessar o meu <a href="https://youtube.com/cursoemvideo" target="_blank" rel="external">canal gratuito no youtube</a></p>
    <h2>Usando links internos</h1> <!--vai fazer a relação com outra pag que esta dentro do nosso servidor e diz respeito a nossa propria pag.
    Passo-a-passo: Criar um novo arquivo dentro dessa pasta do vscode (aqui do lado esquerdo chamada pag002.html ! e mudar idioma -->
    <p>Esta é a primeira página do site. Se você quiser, pode acessar também a minha <a href="pag002.html">segunda página</a></p> <!-- digite "a" e entre o >< colocar a frase que vai ser clicavel.
    Para escolher a pag002, clique entre as aspas e aperte ctrl + espaço.
    Para funcionar os arquivos devem estar junto na mesma pasta.-->
    <a href=""></a>
</body>
</html>
