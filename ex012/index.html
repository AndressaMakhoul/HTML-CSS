<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos com HTML5</title>
</head>
<body>
    <h1>Inserindo vídeos hospedados localmente</h1> <!--Usando a tag video vao consumir muito trafego de dados, tem que passar isso para o cliente porque vai ficar caro (consumo de banda)-->
    <p>Este vídeo está hospedado no meu próprio servidor</p>
    
    <video width="500" poster="imagens/tumbnail-flores.png" controls autoplay loop> <!--Colocar a tag video, tirar o src= colocar esses parametros e colocar em baixo todos os tipos de arquivo abaixo-->
        <source src="midia/meu-video/meu-video.mp4" type="video/mp4">
        <source src="midia/meu-video/meu-video.m4v" type="video/m4v">
        <source src="midia/meu-video/meu-video.webm" type="video/webm">
        <source src="midia/meu-video/meu-video.ogv" type="video/ogv">
        <p>Seu navegador não tem compatibilidade com reprodução de vídeos.</p>
    </video>

    <h1>Inserindo vídeos do Youtube</h1> <!--ir em um vídeo clicar em compartilhar e incorporar / NÃO CONSOME DADOS / se o video esta no site e no youtube a chance do seu site ser encontrato na web é muito maior / VIMEO (tem mais personalização) caso queira colocar o video mas que nao todos vejam, porem o algoritmo dele nao é tao bom-->
    <iframe width="500" height="315" src="https://www.youtube.com/embed/PeY9pWJ2Mbk?si=R51r8lWtcYcY2evz" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
