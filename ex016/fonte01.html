<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes com Google Fontes</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap');

        @import url('https://fonts.googleapis.com/css2?family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&display=swap');

        body{
            font-family: "Red Hat Text", sans-serif;
            font-optical-sizing: auto;
            font-size: 16px;
            font-style: normal;
            color: rgb(0, 0, 0);
        }

        h1 {
            font-family: "Lexend", sans-serif;
            font-optical-sizing: auto;
            font-size: 20px;
            color: rgb(250, 146, 9);
        }
        
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Saepe beatae porro, ipsum voluptatibus voluptatem sapiente deleniti qui veniam quasi nihil perferendis id ex consequuntur, recusandae asperiores veritatis harum, velit sed.</p>
</body>
</html>
