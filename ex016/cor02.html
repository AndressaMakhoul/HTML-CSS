<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>
    <style>
        * { /* Configurações globais das CSS - o asterisco indica ser o seletor global das css */
            height: 100%;
        }
        body {
            background-image: linear-gradient(-45deg, #e99086, #f5d3e2, #f5e5f8);
            background-attachment: fixed; /*não deixa espaço em branco na tela quando usa o scroll */
        }
    </style>
</head>
<body>
    <h1>Testando Gradiente</h1>
</body>
</html>
